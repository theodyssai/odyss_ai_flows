[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyss_ai_flows"
version = "0.4.1"
authors = [
    { name = "Aleksander Bydlowski", email = "ai@bydlow.ski" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"

dependencies = [
    "jinja2",
    "networkx",
    "python-dotenv",
    "pydantic>=2",
]

[project.optional-dependencies]
azure = ["odyss_ai_flows_azure>=0.1.1"]
openrouter = ["odyss_ai_flows_openrouter>=0.1.1"]

[project.scripts]
odyss = "odyss_ai_flows.cli:main"

[tool.setuptools.packages.find]
include = ["odyss_ai_flows*"]

[tool.setuptools.package-data]
"odyss_ai_flows._starter_templates" = [
    "*.md",
    "*.txt",
    "*.json",
    "flow/*.txt",
    "flow/*.json",
    "flow/*.jinja2",
]
