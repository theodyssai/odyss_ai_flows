[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyss_ai_flows_cache"
version = "0.1.1"
authors = [
    { name = "Patryk Fidler", email = "fidler.patryk@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "odyss_ai_flows>=0.4.1",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["odyss_ai_flows_cache*"]
