[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyss_ai_flows_durable"
version = "0.1.1"
authors = [
    { name = "Aleksander Bydlowski", email = "ai@bydlow.ski" },
    { name = "Daniel Slusarczyk", email = "dslusarczyk@theodyss.ai" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"

dependencies = [
    "odyss_ai_flows>=0.4.1",
    "azure-functions-durable",
    "httpx>=0.27",
    "networkx",
    "opentelemetry-api==1.38.0",
]

[tool.setuptools.packages.find]
include = ["odyss_ai_flows_durable*"]
